services:
  test:
    build:
      context: .
      args:
        RUBY_VERSION: ${RUBY_VERSION:-3.3}
    environment:
      GRAPHQL_ARMORY_ENGINE: ${GRAPHQL_ARMORY_ENGINE:-interpreter}
      GRAPHQL_VERSION: ${GRAPHQL_VERSION:-}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
    volumes:
      - .:/app
      - bundle:/bundle
    command: bash bin/test

  # For RedisStore's specs. Keys are prefixed per example and expire, so runs can share it.
  redis:
    image: redis:7-alpine

volumes:
  bundle:
    # One gem cache per Ruby version, so switching RUBY_VERSION never reuses native extensions.
    name: graphql-armory-bundle-ruby${RUBY_VERSION:-3.3}
