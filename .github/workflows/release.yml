name: Release

# Publishes the gem to RubyGems.org with Trusted Publishing (OIDC): no API key is stored and no OTP is asked.
# To release: bump GraphQL::Armory::VERSION on main, then push the matching tag:
#   git tag v0.1.0.pre2 && git push origin v0.1.0.pre2
# Only a tag on a commit of main publishes. The `release` environment can require a maintainer's approval
# before the push runs (on a public repository, or a private one on a paid GitHub plan).
# One-time setup on rubygems.org: graphql-armory > Trusted publishers > Create, with
# owner `israelb`, repository `graphql-armory`, workflow `release.yml`, environment `release`.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read # the tag already exists, so `rake release` never pushes to git
      id-token: write # Trusted Publishing: exchanges the GitHub identity for a short-lived RubyGems token
    steps:
      # Actions are pinned to commits because this job can publish the gem.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check that the tag is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "Tag ${GITHUB_REF_NAME} points to a commit that is not on main" >&2
            exit 1
          fi
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Check that the tag matches the gem version
        run: |
          version=$(ruby -r ./lib/graphql/armory/version -e 'print GraphQL::Armory::VERSION')
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match GraphQL::Armory::VERSION ${version}" >&2
            exit 1
          fi
      - name: Run the specs
        run: bundle exec rspec
      - uses: rubygems/release-gem@7f9650160c1a4e7989fdc9855807bdbd421d8b6b # v1.4.1
