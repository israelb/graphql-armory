name: Commits

# Apart from CI because this one also runs on docs-only changes, which skip the specs.
on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - run: bash bin/check-commits "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
